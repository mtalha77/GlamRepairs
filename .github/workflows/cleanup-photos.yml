name: Photo cleanup

# Calls /api/cron/cleanup-photos daily on GitHub's scheduler, because Vercel
# cron does not fire on this project (see gsc-sync.yml). vercel.json has
# declared this job since August, but with no workflow it never ran. Each
# run deletes assessment photographs past their 30 days and any file no
# lead points to (20 October 2026). Safe to run twice.

on:
  schedule:
    - cron: "7 22 * * *" # 03:07 PKT
  workflow_dispatch:

concurrency:
  group: cleanup-photos
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: https://www.glamrepairs.com/api/cron/cleanup-photos
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl --silent --show-error --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 130 --write-out '%{http_code}' --output response.json \
            --header "Authorization: Bearer ${CRON_SECRET}" "${URL}")
          echo "HTTP ${code}"; cat response.json; echo
          {
            echo "### Photo cleanup"
            jq -r '"- expired: \(.leadsProcessed // 0) leads, \(.filesDeleted // 0) files\n- orphans: \(.orphans.deleted // 0) deleted of \(.orphans.checked // 0) checked"' response.json
            jq -r '.orphans.error? // empty | "- ⚠️ orphan sweep: \(.)"' response.json
          } >> "$GITHUB_STEP_SUMMARY" || true
          [ "${code}" = "200" ] || { echo "::error::Photo cleanup failed (HTTP ${code})."; exit 1; }
